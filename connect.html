<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>守护连线 · 互联网连接</title><style>body{font:16px system-ui;max-width:760px;margin:40px auto;padding:0 20px;background:#081313;color:#e9f5ed}h1{color:#83f2b4}.box{border:1px solid #23403c;border-radius:14px;padding:22px;margin:18px 0;background:#102120}button,input{padding:11px;border-radius:8px;border:1px solid #456;color:inherit;background:#0b1918}button{background:#83f2b4;color:#062017;font-weight:bold;cursor:pointer}input{font-size:20px;letter-spacing:.12em;width:150px}video{width:100%;margin-top:16px;background:#000;border-radius:10px}.muted{color:#9ab5ab}.hidden{display:none}.danger{background:#ff7f80}</style></head><body><h1>互联网远程协助</h1><p class="muted">屏幕流使用 WebRTC 加密传输。被控端必须主动授权；本页面不注入鼠标或键盘。</p><div class="box"><h2>被控端：创建会话</h2><button id="create">生成连接码</button><strong id="room"></strong><p id="hostStatus" class="muted"></p><button id="share" class="hidden">同意并开始共享屏幕</button><video id="local" autoplay muted playsinline class="hidden"></video></div><div class="box"><h2>协助端：加入会话</h2><input id="code" maxlength="6" inputmode="numeric" placeholder="000000"><button id="join">请求连接</button><p id="guestStatus" class="muted"></p><video id="remote" autoplay playsinline class="hidden"></video></div><script>
const ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host),$=id=>document.getElementById(id);let pc,role,room,local;
const status=(id,t)=>$(id).textContent=t; const ice={iceServers:[{urls:'stun:stun.l.google.com:19302'}]};
function setup(){pc=new RTCPeerConnection(ice);pc.onicecandidate=e=>e.candidate&&ws.send(JSON.stringify({type:'ice',candidate:e.candidate}));pc.ontrack=e=>{$('remote').srcObject=e.streams[0];$('remote').classList.remove('hidden')};}
ws.onmessage=async e=>{const m=JSON.parse(e.data);if(m.type==='created'){room=m.room;$('room').textContent='  '+room;status('hostStatus','等待协助端请求…')}if(m.type==='request'){status('hostStatus','收到连接请求，请确认权限');$('share').classList.remove('hidden')}if(m.type==='waiting')status('guestStatus','请求已发送，等待被控端同意…');if(m.type==='reject'){status('guestStatus','对方拒绝了本次连接')}if(m.type==='approve'&&role==='guest'){setup();status('guestStatus','已授权，正在建立加密连接…');const offer=await pc.createOffer();await pc.setLocalDescription(offer);ws.send(JSON.stringify({type:'offer',offer}))}if(m.type==='offer'&&role==='host'){setup();await pc.setRemoteDescription(m.offer);local=await navigator.mediaDevices.getDisplayMedia({video:true,audio:false});local.getTracks().forEach(t=>pc.addTrack(t,local));$('local').srcObject=local;$('local').classList.remove('hidden');const answer=await pc.createAnswer();await pc.setLocalDescription(answer);ws.send(JSON.stringify({type:'answer',answer}));status('hostStatus','屏幕共享中')}if(m.type==='answer'&&role==='guest'){await pc.setRemoteDescription(m.answer);status('guestStatus','已连接，正在接收屏幕')}if(m.type==='ice'&&pc)try{await pc.addIceCandidate(m.candidate)}catch{}if(m.type==='stop'){status(role==='host'?'hostStatus':'guestStatus','连接已结束');pc?.close()}};
ws.onopen=()=>{};$('create').onclick=()=>{role='host';ws.send(JSON.stringify({type:'create'}));$('create').disabled=true};$('join').onclick=()=>{const c=$('code').value.replace(/\D/g,'');if(c.length!==6)return status('guestStatus','请输入 6 位连接码');role='guest';room=c;ws.send(JSON.stringify({type:'join',room:c}));$('join').disabled=true};$('share').onclick=()=>{ws.send(JSON.stringify({type:'approve'}));$('share').disabled=true};
</script></body></html>
